version: 2
updates:
  # Python dependencies (reads uv.lock + pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle minor + patch bumps into one PR to avoid PR sprawl;
      # major bumps still arrive as individual PRs for careful review.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # netCDF4's floor is deliberately permissive. netcdf4 >= 1.7.4 requires
      # numpy >= 2.3, which requires Python >= 3.11 — so raising the floor makes
      # the (Python 3.10, ARM64, win32) resolution split unsatisfiable and
      # `uv lock` fails outright. Keeping `>= 1.7.0` lets uv split the lock
      # instead: 1.7.3 on that platform, 1.7.4 everywhere else. Dependabot has
      # no way to know that and retried the bump weekly, failing every time.
      # Revisit when requires-python moves past 3.10.
      - dependency-name: "netCDF4"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

      # torch / numpy / torchvision are declared TWICE in one requirement list,
      # split by mutually exclusive markers with different pins — the Intel-Mac
      # boundary (darwin + x86_64 caps torch <2.3, numpy <2, torchvision <0.18;
      # every other platform gets current versions). Dependabot's Python file
      # updater cannot rewrite a marker-split declaration: it looks for a single
      # declaration string and aborts with "Declaration not found for torch!"
      # (RequirementReplacer#original_dependency_declaration_string). So these
      # have never actually produced update PRs — the failure was masked by the
      # netCDF4 error above until that was silenced.
      #
      # Ignoring them does not cost coverage we still had: the same file-updater
      # bug would block a security update's write for these packages too, and
      # per GitHub's docs `ignore` governs version updates rather than security
      # advisories. What it does buy is a GREEN updater run, so the next genuine
      # failure is visible instead of buried under a standing red.
      #
      # TRADE-OFF, stated plainly: torch and numpy now need periodic MANUAL
      # review. Revisit if the marker split goes away (dropping Intel-Mac
      # support would do it) or if Dependabot learns to handle split
      # declarations.
      - dependency-name: "torch"
      - dependency-name: "numpy"
      - dependency-name: "torchvision"

      # setuptools lives in [build-system] requires, which the uv ecosystem
      # updater does not edit at all — same "Declaration not found" failure,
      # different root cause. The pin is a build-time floor, not a runtime
      # dependency, and it is exercised on every sdist build in CI.
      - dependency-name: "setuptools"

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # pre-commit hook revisions (.pre-commit-config.yaml). Without this the hook
  # pins drift from the dev-group pins the "uv" ecosystem keeps current — the
  # ruff hook sat 15 patch releases behind the ruff CI lints with.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]
