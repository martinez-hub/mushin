version: 2
updates:
  # Python dependencies (reads uv.lock + pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle minor + patch bumps into one PR to avoid PR sprawl;
      # major bumps still arrive as individual PRs for careful review.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # torch, torchvision and numpy used to be ignored here: Intel macOS needed
    # its own marker-split pins for them, which Dependabot cannot rewrite. That
    # split is gone, so they update normally, with two limits worth knowing:
    #   - Dependabot tracks only the LOWEST version uv.lock holds for a package
    #     and resolves at the lowest supported Python (3.11). So it never moves
    #     the 3.12+ entry of a package locked twice (numpy today), nor scipy
    #     past 1.17 (1.18 needs Python 3.12): those need a manual
    #     `uv lock --upgrade-package <name>`. If it does propose a bump for such
    #     a package, its `uv lock --upgrade-package <name>==<ver>` collapses
    #     every entry to that one version, so check the uv.lock diff.
    #   - Runtime floors in pyproject.toml stay put only while
    #     [project].description matches the PyPI summary of the latest
    #     release; when they differ, Dependabot raises floors (#154). Check the
    #     pyproject.toml diff on Dependabot PRs after editing the description.
    ignore:
      # setuptools lives in [build-system] requires, which the uv ecosystem
      # updater does not edit at all — same "Declaration not found" failure,
      # different root cause. The pin is a build-time floor, not a runtime
      # dependency, and it is exercised on every sdist build in CI.
      - dependency-name: "setuptools"

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # pre-commit hook revisions (.pre-commit-config.yaml). Without this the hook
  # pins drift from the dev-group pins the "uv" ecosystem keeps current — the
  # ruff hook sat 15 patch releases behind the ruff CI lints with.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]
