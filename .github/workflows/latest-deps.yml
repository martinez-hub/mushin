name: Latest dependencies

# The mirror of CI's `min-versions` job. That one resolves the LOWEST declared
# versions so the floors in pyproject.toml stay honest; this one resolves the
# HIGHEST, ignoring uv.lock, so a breaking upstream release is found here rather
# than on a user's machine.
#
# Why this is needed even though Dependabot bumps the lock weekly and CI runs the
# full matrix on that PR: between an upstream release and our next Dependabot run,
# `pip install mushin-py` resolves to versions nothing has tested. hydra-core
# 1.3.6 is the motivating case — it shipped a behaviour change in a PATCH release
# (instantiate now rejects functools.partial subclasses), so no upper bound at
# minor granularity would have caught it, and capping at patch granularity would
# block security patches. Testing latest is the option that costs users nothing.
#
# Deliberately NOT part of CI: it can go red because someone else published
# something, and that must never block a merge here. It runs on a schedule and
# files an issue instead.
on:
  schedule:
    # Daily. Weekly would be no faster than the Dependabot bump it exists to beat.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # to create its label and file/update the failure report (last step)

concurrency:
  group: latest-deps
  cancel-in-progress: true

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `uv lock --upgrade` re-resolves every dependency to the newest version
      # the declared constraints allow, discarding the pins in uv.lock. The
      # lockfile is NOT committed — this job only reports.
      - name: Re-resolve every dependency to its latest allowed version
        id: lock
        run: uv lock --upgrade

      - name: Show what that resolved to
        id: sync
        run: |
          uv sync --extra eval --extra viz --extra netcdf
          uv pip list

      # What actually changed versus the committed lock. Printed before the tests
      # so a failure can be read against it without digging through the diff.
      - name: Diff against the committed lock
        run: |
          echo '### Versions differing from `uv.lock`' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --no-color -U0 uv.lock \
            | grep -E '^[+-]version = |^[+-]name = ' \
            | head -80 >> "$GITHUB_STEP_SUMMARY" || echo '(no version changes)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: tests
        # --no-sync so this cannot quietly re-resolve back to the committed lock,
        # the same guard `min-versions` uses in the opposite direction.
        run: uv run --no-sync pytest tests/ -p no:cacheprovider

      # A scheduled job whose failure only appears in the Actions tab is a job
      # nobody reads. File an issue — and reuse the open one rather than posting a
      # duplicate every morning until it is fixed.
      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCK: ${{ steps.lock.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          # Create the label on first use, so this step needs no manual repo
          # setup. --force makes it idempotent: it updates the label if it
          # already exists instead of failing.
          gh label create latest-deps --force --color B60205 \
            --description "A failure against the latest allowed dependency versions"
          # Say which step failed. Only a test failure points at an upstream
          # release that breaks mushin. A failed re-resolve leaves no version
          # diff, and its cause can be uv itself (setup-uv installs the latest)
          # or this repo's own uv config, as in #244.
          if [ "$LOCK" = failure ]; then
            stage="re-resolving (\`uv lock --upgrade\`)"
            cause="Nothing was resolved, so there is no version diff. Read the resolver error in the run log. The cause may be a dependency release, a new uv release (setup-uv installs the latest uv), or this repository's uv configuration."
          elif [ "$SYNC" = failure ]; then
            stage="installing the resolved versions (\`uv sync\`)"
            cause="Read the install error in the run log. A new release may have no wheel for this platform, or its source distribution may fail to build."
          elif [ "$TESTS" = failure ]; then
            stage="the tests"
            cause="**A released upstream version likely breaks mushin.** Anyone installing today may hit it, since our constraints permit that version. The step summary lists which versions differ from \`uv.lock\`."
          else
            stage="another step"
            cause="Read the run log."
          fi
          existing=$(gh issue list --state open --label latest-deps \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on latest dependencies, at $stage: $RUN_URL"
          else
            gh issue create --title "Failure against latest dependencies" \
              --label latest-deps \
              --body "$(printf '%s\n' \
                "The scheduled \`Latest dependencies\` run failed at $stage." \
                "" \
                "This job re-resolves every dependency to the newest version our constraints allow, ignoring \`uv.lock\`, then runs the tests." \
                "" \
                "$cause" \
                "" \
                "Run: $RUN_URL" \
                "" \
                "Triage:" \
                "1. Find the culprit: the error in the run log, or, for a test failure, the version diff in the step summary." \
                "2. If the upstream change is intended, adapt mushin." \
                "3. If it is an upstream regression, pin *that version* out (\`!= x.y.z\`) rather than adding a blanket ceiling, and link the upstream issue." \
                "" \
                "This issue is reused while it stays open, so it will be commented on rather than duplicated.")"
          fi
