name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, test, build
# docs). No job writes contents, issues, or PRs.
permissions:
  contents: read

# Cancel a superseded run on the same ref (e.g. when a PR branch is updated)
# instead of letting redundant matrices pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches code, so docs-only PRs can skip the heavy
  # test matrix. The `ci-ok` summary job (bottom) is the single required status
  # check, so jobs that are skipped here never block a merge.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      notebooks: ${{ steps.filter.outputs.notebooks }}
      notebook_prereqs: ${{ steps.filter.outputs.notebook_prereqs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            notebooks:
              - 'docs/notebooks/**'
            # `notebook-prereqs` builds one venv per distinct install line (each
            # pulling torch), so it is too slow to run on every code change. It
            # only verifies "what a notebook declares covers what it imports",
            # which can change in four places: the notebooks, the extras they
            # name, the module->extra import guards, and the checker itself.
            notebook_prereqs:
              - 'docs/notebooks/**'
              - 'pyproject.toml'
              - 'scripts/check_notebook_prereqs.py'
              - 'src/mushin/**/__init__.py'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dev environment
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Spell check
        run: uv run codespell src tests examples README.md CHANGELOG.md CONTRIBUTING.md RELEASING.md pyproject.toml changes

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          # macOS: researchers' most common dev platform, and the platform-split
          # dependency branches in pyproject.toml (Intel-mac torch<2.3/numpy<2 vs
          # arm64 NumPy-2) are exercised nowhere else. One arm64 leg on the newest
          # supported Python, one x86_64 (macos-13) leg on the oldest.
          - { os: macos-latest, python-version: "3.13", experimental: false }
          - { os: macos-15-intel, python-version: "3.10", experimental: false }
          # 3.14 is a supported, advertised version: these legs block like any
          # other. Intel-mac is deliberately absent — it caps at torch 2.2.2,
          # which has no 3.14 wheels.
          - { os: ubuntu-latest, python-version: "3.14", experimental: false }
          - { os: windows-latest, python-version: "3.14", experimental: false }
          - { os: macos-latest, python-version: "3.14", experimental: false }
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync environment (Python ${{ matrix.python-version }})
        # --extra detection/image/audio exercise the optional batteries. Their
        # C-extension deps (pycocotools, pesq, pystoi) are win32-gated, so on
        # Windows those metrics are absent and the corresponding tests skip via
        # importorskip; SSIM/PSNR/MS-SSIM/SI-SDR core paths still run.
        run: uv sync --extra eval --extra detection --extra image --extra audio --python ${{ matrix.python-version }}
      - name: Show resolved environment
        run: uv pip list
      - name: Run tests
        run: uv run --extra eval --extra detection --extra image --extra audio pytest tests/ --hypothesis-profile fast -p no:cacheprovider

  inspect-ai-adapter:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The Inspect AI adapter example is tested two ways: duck-typed stand-ins in
    # the main `test` job, and REAL inspect_ai objects here. Duck-types encode our
    # belief about EvalLog's shape — if a field were renamed upstream they would
    # all keep passing while real logs broke. inspect-ai pulls ~110 packages, so
    # it is not a dev dependency; it gets its own throwaway venv instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Clean-env install (inspect-ai + eval extra) and run the adapter tests
        run: |
          uv venv /tmp/inspect
          uv pip install --python /tmp/inspect/bin/python \
            inspect-ai pytest hypothesis matplotlib ".[eval]"
          # -W error::pytest.PytestUnraisableExceptionWarning is not enough: the
          # point is that these must RUN, so fail if any of them skipped.
          /tmp/inspect/bin/python -m pytest tests/test_examples_inspect_ai.py \
            -p no:cacheprovider -rs -q | tee /tmp/inspect-out.txt
          if grep -q "skipped" /tmp/inspect-out.txt; then
            echo "::error::Inspect AI adapter tests skipped in the job that exists to run them"
            exit 1
          fi

  batteries-clean-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Install the BUILT wheel (not the editable repo) with the battery extras into
    # a fresh environment and run the battery examples against it — catches
    # packaging / optional-extra resolution issues the editable `test` job misses.
    # Linux only (the C-extension extras pycocotools/pystoi are win32-gated).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build --wheel
      - name: Clean-env install (wheel + battery extras) and run the examples
        run: |
          uv venv /tmp/clean-batteries
          uv pip install --python /tmp/clean-batteries/bin/python \
            "$(ls dist/*.whl)[detection,image,audio]"
          /tmp/clean-batteries/bin/python examples/batteries.py

  notebooks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.notebooks == 'true'
    # Execute every docs/notebooks/*.ipynb with nbmake so the example notebooks
    # can never rot. nbmake checks that cells RUN (not output equality), so
    # numerical drift never makes this flaky; committed outputs are for display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Register python3 kernel
        run: uv run python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Execute example notebooks
        # --extra eval: notebooks 02/03/05 use compare / Study / LLM eval, which
        # live in the eval extra; --extra viz for the plotting cells.
        # --extra netcdf: notebook 07 recommends the netCDF4 engine; without it
        # the to_netcdf cell silently exercises only scipy's netCDF3 fallback.
        run: uv run --extra eval --extra viz --extra netcdf pytest --nbmake docs/notebooks/ -p no:cacheprovider

  notebook-prereqs:
    needs: changes
    if: needs.changes.outputs.notebook_prereqs == 'true'
    # The `notebooks` job above installs EVERY extra, so it cannot catch a
    # notebook whose stated prerequisites are wrong — one that needs `eval`
    # while its callout names only `viz` passes there and then fails for the
    # reader on cell 1. This job runs each notebook in a throwaway venv holding
    # exactly the `%pip install` line that notebook shows, so an
    # under-specified callout fails CI instead of the reader.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run each notebook with only its declared prerequisites
        run: uv run python scripts/check_notebook_prereqs.py

  changelog:
    runs-on: ubuntu-latest
    # PRs only (the check diffs the base branch); never on push to main, and
    # exempt Dependabot (lockfile/deps PRs carry no user-facing fragment).
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # towncrier check diffs against the base branch
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dev environment
        run: uv sync
      # `towncrier check` auto-passes when CHANGELOG.md itself is edited, so a
      # PR that hand-edits the changelog (the old workflow) would bypass the
      # fragment gate. Reject direct CHANGELOG.md edits unless the PR carries the
      # `changelog-exempt` label — used by release PRs (which rewrite it via
      # `make changelog`) and the one-time bootstrap PR that adds the marker.
      - name: Disallow direct CHANGELOG.md edits (use a changes/ fragment)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-exempt') }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md | grep -q .; then
            echo "::error::CHANGELOG.md is assembled from changes/ fragments at release time — don't edit it directly. Add a changes/<id>.<type>.md fragment instead (see changes/README.md). Release PRs (or the towncrier bootstrap): apply the 'changelog-exempt' label."
            exit 1
          fi
      - name: Changelog fragment check
        run: uv run towncrier check --compare-with origin/${{ github.base_ref }}

  min-versions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Resolves the *lowest* declared dependency versions and runs the suite, so
    # the floors in pyproject.toml stay honest. Runs on the oldest supported
    # Python (3.10). Reproduce locally with `make test-lowest` (amd64 Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync lowest-direct dependency versions (Python 3.10)
        # Deliberately NO battery extras here: pycocotools' floor wheel is
        # ABI-incompatible with the numpy floor at lowest-direct (see the note
        # above [tool.setuptools.packages.find] in pyproject.toml). The battery
        # extras are exercised at latest versions by the `test` and
        # `batteries-clean-install` jobs instead.
        run: uv sync --resolution lowest-direct --extra eval --python 3.10
      # Some deps at their floor still `import pkg_resources` at import time; uv's
      # minimal venv omits setuptools, which typical user environments include.
      # Provide it so this job tests dependency-version compatibility, not
      # setuptools presence. Pin < 81: setuptools 81 removed pkg_resources.
      - name: Provide setuptools (pkg_resources) for old floors
        run: uv pip install "setuptools<81"
      - name: Show resolved environment
        run: uv pip list
      - name: Run tests
        # --no-sync: never re-resolve here. A plain `uv run` would sync to the
        # default (highest) resolution and silently test latest deps instead of
        # the floors this job exists to validate.
        run: uv run --no-sync pytest tests/ --hypothesis-profile fast -p no:cacheprovider

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build docs (strict)
        run: uv run --group docs mkdocs build --strict

  core-only:
    # Guards the eval-extra split: a core install (NO extras) must import, run a
    # real sweep, and give a clear install hint when the eval layer is accessed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install core only (no extras) and smoke-test
        run: |
          uv venv /tmp/core
          uv pip install --python /tmp/core/bin/python .
          /tmp/core/bin/python - <<'PY'
          import mushin

          # 1. Core import must not pull torchmetrics/scipy.
          import sys
          assert "torchmetrics" not in sys.modules, "core import pulled torchmetrics"

          # 2. A real sweep -> dataset works with the core install alone.
          @mushin.sweep
          def experiment(x):
              return dict(y=float(x) * 2)

          ds = experiment.run(x=mushin.multirun([1, 2, 3]))
          assert ds.sizes == {"x": 3} and float(ds["y"].sel(x=2)) == 4.0

          # 3. Accessing the (lazy) eval layer gives an actionable install hint.
          for name in ("compare", "classification_battery", "llm"):
              try:
                  getattr(mushin, name)
                  raise SystemExit(f"expected ImportError accessing mushin.{name}")
              except ImportError as e:
                  assert "mushin-py[eval]" in str(e), f"unhelpful error for {name}: {e}"
          print("core-only smoke test passed")
          PY

  # Single required status check. Passes when no needed job failed or was
  # cancelled — skipped jobs (e.g. the test matrix on a docs-only PR) are fine.
  # Set branch protection to require ONLY this check.
  ci-ok:
    if: always()
    needs: [changes, lint, test, batteries-clean-install, inspect-ai-adapter, notebooks, notebook-prereqs, changelog, min-versions, docs, core-only]
    runs-on: ubuntu-latest
    steps:
      # Fail CLOSED: require every needed job to be success/skipped rather than
      # enumerating the bad states. The old guard tested only for 'failure' and
      # 'cancelled', but GitHub also reports 'abandoned' (observed when a job
      # dies during setup, e.g. a 429 downloading an action) — so genuinely
      # failed jobs passed the gate and this was the only required check on
      # main. Anything not explicitly good now blocks, and a result value we
      # have not seen yet cannot silently reopen the hole.
      - name: Require every job to have succeeded or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::A required job did not pass:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
