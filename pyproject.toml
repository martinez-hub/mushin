[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is "mushin-py" (the "mushin" name was taken);
# the import package is still `import mushin` (see src/mushin/).
name = "mushin-py"
version = "0.15.0"
description = "Boilerplate-free, reproducible machine-learning experiment sweeps: a framework-agnostic sweep engine built on hydra-zen, with first-class PyTorch Lightning integration. Carved out of MIT-LL's responsible-ai-toolbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Josue Martinez-Martinez" },
]
maintainers = [
    { name = "Josue Martinez-Martinez" },
]
keywords = ["machine learning", "reproducibility", "pytorch-lightning", "hydra", "hydra-zen"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 3.14 is classified now that its CI legs (linux/windows/macos-arm64) are
    # required to pass rather than continue-on-error.
    "Programming Language :: Python :: 3.14",
    # 3.15 is NOT classified yet: hydra-zen 0.17.0 cannot import on it, and
    # PyPI has no cp315 torch (PyTorch's own index has cp315 builds, but the
    # macOS/Windows ones crash, pytorch#200779). The non-required
    # .github/workflows/python-315-preview.yml tracks it; classify 3.15 when
    # it joins ci.yml's required matrix (checklist in
    # docs/superpowers/specs/2026-10-14-python-311-315-design.md, D4).
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Lightning floor is 2.4: the pre-2.0 API (1.5) doesn't run this package, and
    # we pin the floor to pair with the torch >= 2.4 floor below (Lightning 2.4 is
    # contemporaneous with torch 2.4). Verified by the min-version CI job.
    "pytorch-lightning >= 2.4.0",
    # hydra-zen floor is 0.17: hydra-core 1.3.7 refuses to instantiate the
    # `hydra._internal` sweeper target that earlier hydra-zen releases name
    # directly, which breaks every multirun. 0.17.0 builds the sweeper through
    # Hydra's plugin registry instead (hydra-zen#885), so this floor is what
    # makes sweeps work on a current hydra-core. (0.10 was the older floor:
    # `mushin.study` imports `hydra_zen.multirun`, which 0.9 doesn't export.)
    "hydra-zen >= 0.17.0",
    # hydra-core floor is 1.3.7, raised together with the hydra-zen floor. On
    # hydra-core 1.3.6 exactly, hydra-zen 0.17.0's target-policy patch finds the
    # policy module (added in 1.3.6) but calls a helper that only exists in
    # 1.3.7, so instantiating any config that carries a callable raises
    # `AttributeError: ... '_reject_protected_result'`. 1.3.7 is also the
    # release that fixes GHSA-mwj6-rfh8-7qf4 (high; vulnerable
    # `>= 1.3.4, < 1.3.7`), so this floor retires that range rather than
    # permitting it. That advisory is repository-scoped and does not resolve
    # through OSV or the global GitHub advisory DB; read it at
    # https://github.com/hydra-ecosystem/hydra/security/advisories/GHSA-mwj6-rfh8-7qf4
    # No ceiling: a hard upper bound on a library propagates into every
    # downstream resolution. Both floors are verified by the min-version CI job.
    "hydra-core >= 1.3.7",
    # torch floor is 2.4: mushin requires NumPy 2 (below), which is
    # ABI-incompatible with torch built against NumPy 1.x, and PyTorch first
    # ships NumPy-2-compatible wheels in 2.4.0 ("Numpy is not available" below
    # that). Intel macOS (x86_64) is not supported: PyTorch publishes no x86_64
    # macOS wheels after 2.2 (see [tool.uv] environments). The min-version CI
    # job verifies the numpy floor. It resolves torch 2.4.1, not 2.4.0, because
    # the lock resolves every extra together and torchvision 0.19.0 caps numpy<2.
    "torch >= 2.4.0",
    "numpy >= 2",
    "omegaconf >= 2.2",
    # xarray 2024.6.0 is the first NumPy-2-compatible release (older xarray uses
    # `np.unicode_`, removed in NumPy 2). Verified by the min-version CI job.
    "xarray >= 2024.6.0",
    # pandas is required transitively by xarray (a core dep) and is also used by
    # the eval layer, so it stays in base — gating it would be cosmetic since
    # xarray installs it regardless. `torchmetrics` and `scipy`, by contrast, are
    # used ONLY by the eval layer and move to the `eval` extra below.
    # pandas 2.2.2 is the first release officially compatible with NumPy 2;
    # older pandas imports under NumPy 2 only by luck (ABI "size changed"
    # warning). Verified by the min-version CI job.
    "pandas >= 2.2.2",
]

[project.optional-dependencies]
# matplotlib >= 3.9 works with NumPy 2. Releases up to 3.8.3 do not: 3.7.3-3.8.3
# cap numpy<2, and older wheels fail its ABI ("numpy.core.multiarray failed to
# import"). Verified by the min-version CI job (matplotlib is in the dev group).
viz = ["matplotlib >= 3.9"]
netcdf = ["netCDF4 >= 1.7.0"]
mcp = ["mcp >= 2, < 3"]
# The evaluation layer: `compare`, the metric batteries, LLM evaluation, and
# `Study`. Kept out of the core install (whose identity is sweep -> dataset) so a
# plain `pip install mushin-py` stays lean. torchmetrics/scipy are used ONLY here.
# Floors: scipy 1.13 is the first NumPy-2-compatible release (lower floors are ABI-
# incompatible, `_ARRAY_API not found`). Verified by the min-version CI job.
eval = [
    "torchmetrics >= 1.0",
    "scipy >= 1.13",
]
# Detection metrics (MeanAveragePrecision + IoU variants) need torchvision and
# pycocotools; gated so the core install stays lean. The torchvision floor (0.19)
# pairs with the torch >= 2.4 floor above; no CI job floor-tests it, because
# min-versions installs only the eval extra. pycocotools floor is 2.0.7 — the
# first release with wheels (2.0.0 has no Cython build-dep and fails to build).
detection = [
    "mushin-py[eval]",  # metric batteries live in the eval layer (torchmetrics)
    "torchvision >= 0.19",
    # pycocotools is a C extension that is painful to build on Windows; gate it so
    # `pip install mushin-py[detection]` succeeds there (the battery raises a clear
    # error if it is then used without pycocotools).
    "pycocotools >= 2.0.7 ; sys_platform != 'win32'",
]
# Image-quality LPIPS needs torchvision (backbone) + the lpips package; SSIM/PSNR/
# MS-SSIM are core torchmetrics but the battery is all-or-nothing, so it requires
# this extra as a whole. The torchvision floor pairs with the torch floor above.
image = [
    "mushin-py[eval]",  # metric batteries live in the eval layer (torchmetrics)
    "torchvision >= 0.19",
    "lpips >= 0.1.4",
]
# Audio STOI needs the pystoi package; SI-SDR/SI-SNR are core but the battery is
# all-or-nothing. Gated off win32 where the native build is painful (the battery
# raises a clear error if used without it). PESQ is intentionally excluded:
# every `pesq` release (the latest is 0.0.4, 2022) is source-only and needs a C
# compiler to install. With one it builds and runs under NumPy 2; add it via a
# custom Task.
audio = [
    "mushin-py[eval]",  # metric batteries live in the eval layer (torchmetrics)
    "pystoi >= 0.3.3 ; sys_platform != 'win32'",
]

[project.scripts]
mushin-mcp = "mushin.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/martinez-hub/mushin"
Documentation = "https://martinez-hub.github.io/mushin/"
Repository = "https://github.com/martinez-hub/mushin"
Issues = "https://github.com/martinez-hub/mushin/issues"
Changelog = "https://github.com/martinez-hub/mushin/blob/main/CHANGELOG.md"
# Attribution to the project mushin was carved out of (also in LICENSE/README).
"Upstream (origin)" = "https://github.com/mit-ll-responsible-ai/responsible-ai-toolbox"

# Dev tooling, installed by `uv sync` (PEP 735 dependency group).
[dependency-groups]
docs = [
    "mkdocs-material >= 9.5, < 10",
    "mkdocstrings[python]>=1.0.6,<2",
    # Renders committed .ipynb notebooks under docs/notebooks/ into the site.
    # execute:false in mkdocs.yml — the build shows the committed outputs and
    # never runs torch. Notebooks are executed separately by the `notebooks` CI
    # job (nbmake) to prevent rot.
    "mkdocs-jupyter >= 0.24",
]
dev = [
    "ruff>=0.16.0",
    "codespell >= 2.3",
    "pre-commit>=4.6.1",
    "pytest >= 7.0.0",
    "hypothesis>=6.161.6",
    "pytest-xdist >= 3.0",
    "towncrier >= 23.11",
    "matplotlib >= 3.9",
    "netCDF4 >= 1.7.0",
    "mcp >= 2, < 3",
    # dev-only: powers examples/sklearn_sweep.py (a non-Lightning sweep demo) and
    # its test. mushin itself has no scikit-learn dependency or integration.
    # Floor is 1.4.2 — the first release compatible with NumPy 2; earlier
    # scikit-learn is ABI-incompatible with NumPy 2. The
    # min-versions CI job (dev group at lowest-direct, NumPy-2) verifies this.
    "scikit-learn >= 1.4.2",
    # Example-notebook toolchain (docs/notebooks/). jupytext converts the
    # percent-format .py sources into .ipynb and executes them; nbstripout keeps
    # outputs but strips nondeterministic metadata; nbmake (a pytest plugin)
    # re-executes every notebook in CI so they can't rot. nbconvert+ipykernel
    # provide the execution kernel.
    "jupytext>=1.19.5",
    "nbconvert >= 7.0",
    "ipykernel >= 6.0",
    "nbstripout >= 0.7",
    "nbmake >= 1.5",
    # Exercises out-of-process dispatch (loky/processes backend) so the picklable
    # _TaskRunner is verified against a real launcher, not just pickle.dumps.
    "hydra-joblib-launcher >= 1.2",
]
# Detection deps live in the `detection` extra, not here: pycocotools is a C
# extension whose lowest-floor wheel is ABI-incompatible with the min-versions
# job's numpy floor. The `test` CI job installs `--extra detection` to exercise
# the battery; `min-versions` (core-floor validation) deliberately does not.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: ship the py.typed marker so type checkers see our annotations.
mushin = ["py.typed"]

[tool.uv]
# The platforms uv.lock resolves for. Intel macOS (darwin + x86_64) is
# excluded: PyTorch publishes no x86_64 macOS wheels after 2.2, and mushin
# requires torch >= 2.4. Without this, `uv sync` there fails on a missing torch
# wheel; with it, uv states that the platform is unsupported. pip and the
# published package metadata ignore this table.
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples", "tests/plugins"]  # tests/plugins: hydra_plugins test sweeper
addopts = "-m 'not real_data and not cluster'"
markers = [
    "real_data: end-to-end checks that download a real dataset/model (deselected by default; run with -m real_data)",
    "cluster: end-to-end multi-node DDP checks that need a real SLURM/Elastic cluster (deselected by default; run with -m cluster)",
    "config_group: names user-stored ConfigStore group(s) to remove after the test (see restore_config_group fixture)",
]
filterwarnings = [
    # matplotlib internals call deprecated pyparsing APIs; not fixable from here.
    # Scoped to pyparsing so real deprecations from torch/lightning/xarray are
    # not silently swallowed suite-wide.
    "ignore:.* deprecated - use .*:DeprecationWarning:pyparsing",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]  # bugbear is noisy for test fixtures/assertions

[tool.codespell]
skip = "*.lock,*.ckpt,*.pt,.git,.venv,*.egg-info"
# "mushin" (無心) and a few ML terms trip the default dictionary.
ignore-words-list = "mushin,nin,tha,strat"

[tool.towncrier]
# News fragments live in changes/<id>.<type>.md and are assembled into
# CHANGELOG.md at release time by `make changelog VERSION=X.Y.Z`.
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]            # Markdown headings, not RST underlines
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false
