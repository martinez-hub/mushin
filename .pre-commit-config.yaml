# See https://pre-commit.com. Install with `pre-commit install`.
# Hook versions are bumped by Dependabot (see .github/dependabot.yml); run
# `pre-commit autoupdate` for a manual bump. ruff and codespell are the
# exception: they run from the dev environment (`uv run`), so they are the
# versions uv.lock pins and CI runs. A hook pinned separately drifted (the ruff
# hook once sat 15 patch releases behind) and arrived in its own Dependabot PR,
# apart from the uv.lock bump, so the two could disagree between merges and
# local commits could pass a hook that CI then rejected. Run `uv sync` before
# the first commit so the environment exists.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # types_or adds markdown AND jupyter: ruff formats python code blocks
      # inside .md and code cells inside .ipynb, and CI runs `ruff format
      # --check .` over the whole tree — without these the hook passes locally
      # on a doc snippet or a notebook cell that CI then rejects. Both gaps have
      # bitten: markdown once, then notebooks when 08_llm_examples was added.
      # --force-exclude applies ruff's excludes to the files pre-commit passes,
      # as the upstream ruff-pre-commit hooks do.
      - id: ruff-check     # lint
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, markdown, jupyter]
        require_serial: true
      - id: ruff-format    # format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown, jupyter]
        require_serial: true
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
        # Mirrors the Makefile's `spell` target, which CI runs. Left unscoped
        # the hook also reads notebook output cells and archived plans under
        # docs/, which are full of false positives CI never sees — so
        # `pre-commit run --all-files` failed on a tree CI considered clean.
        files: >-
          ^(src/|tests/|examples/|plugins/|\.claude-plugin/|changes/|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|RELEASING\.md|AGENTS\.md|CLAUDE\.md|docs/llms\.txt|pyproject\.toml)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # --keep-id: without it nbstripout renumbers cell ids sequentially, so
        # inserting one cell rewrites the id of every cell after it and buries
        # a two-line prose edit in a hundred lines of churn.
        args: ["--keep-output", "--keep-id"]
